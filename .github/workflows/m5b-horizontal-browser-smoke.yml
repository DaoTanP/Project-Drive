# Temporary visual validation; remove before PR.
name: M5B Horizontal Browser Smoke

on:
  push:
    branches:
      - fix/m5b-horizontal-bounds
    paths:
      - '.github/workflows/m5b-horizontal-browser-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebGame
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'

      - name: Expose test-only game handle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main.ts')
          text = path.read_text()
          text = text.replace(
              'new Phaser.Game(gameConfig);',
              '(window as typeof window & { __horizontalGame?: Phaser.Game }).__horizontalGame = new Phaser.Game(gameConfig);',
          )
          path.write_text(text)
          PY

      - name: Build production package
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Capture representative zones and yaw states
        run: |
          mkdir -p /tmp/m5b-horizontal-shots
          python3 -m http.server 4173 --directory dist >/tmp/m5b-horizontal-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-gpu'],
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 960, height: 540, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('canvas');
          await new Promise((resolve) => setTimeout(resolve, 800));

          async function shot(name) {
            await page.screenshot({ path: `/tmp/m5b-horizontal-shots/${name}.png` });
          }

          async function setRoute(branch, routeDistance, expectedZone) {
            const state = await page.evaluate(({ branch, routeDistance }) => {
              const game = window.__horizontalGame;
              if (!game) throw new Error('missing test game handle');
              const scene = game.scene.getScene('Game');
              scene.road.selectBranch(branch);
              scene.runState.routeDistance = routeDistance;
              const base = scene.road.positionForRouteDistance(routeDistance);
              scene.traffic.cars.forEach((car, index) => {
                car.z = base + 2200 + index * 1700;
                car.passResolved = false;
                car.nearMissArmed = false;
              });
              scene.renderFrame();
              return {
                zone: scene.road.zoneAtRouteDistance(routeDistance),
                playerTexture: scene.playerSprite.texture.key,
                visibleTraffic: scene.trafficSprites
                  .filter((image) => image.visible)
                  .map((image) => image.texture.key),
              };
            }, { branch, routeDistance });
            assert.equal(state.zone, expectedZone, `${routeDistance} expected ${expectedZone}, got ${state.zone}`);
            assert.ok(state.visibleTraffic.length > 0, `${expectedZone}: no visible traffic`);
            return state;
          }

          const initial = await setRoute('safe', 10000, 'city');
          assert.equal(initial.playerTexture, 'player_rear_center');
          await shot('city-center');

          await page.keyboard.down('ArrowLeft');
          await new Promise((resolve) => setTimeout(resolve, 350));
          assert.equal(
            await page.evaluate(() => window.__horizontalGame.scene.getScene('Game').playerSprite.texture.key),
            'player_rear_hard_left',
          );
          await shot('city-hard-left');
          await page.keyboard.up('ArrowLeft');
          await new Promise((resolve) => setTimeout(resolve, 250));

          await page.keyboard.down('ArrowRight');
          await new Promise((resolve) => setTimeout(resolve, 350));
          assert.equal(
            await page.evaluate(() => window.__horizontalGame.scene.getScene('Game').playerSprite.texture.key),
            'player_rear_hard_right',
          );
          await shot('city-hard-right');
          await page.keyboard.up('ArrowRight');
          await new Promise((resolve) => setTimeout(resolve, 250));

          await setRoute('safe', 220000, 'rural');
          await shot('rural-center');
          await setRoute('safe', 400000, 'forest');
          await shot('forest-center');
          await setRoute('risky', 400000, 'mountain-pass');
          await shot('mountain-pass-center');
          await setRoute('risky', 520000, 'tunnel');
          await shot('tunnel-center');

          console.log('representative zone/yaw screenshots captured');
          await browser.close();
          NODE

      - name: Upload representative renders
        uses: actions/upload-artifact@v4
        with:
          name: m5b-horizontal-browser-renders
          path: /tmp/m5b-horizontal-shots/*.png
          if-no-files-found: error
