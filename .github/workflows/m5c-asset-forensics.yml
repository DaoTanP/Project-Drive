name: M5C Asset Forensics

on:
  push:
    branches:
      - feat/m5c-batch-b0-integration
    paths:
      - '.github/workflows/m5c-asset-forensics.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect headers
        run: |
          set -eu
          for f in WebGame/public/assets/props/*.png; do
            echo "=== $f ==="
            file "$f" || true
            wc -c "$f"
            xxd -l 32 "$f" || true
            echo
          done
