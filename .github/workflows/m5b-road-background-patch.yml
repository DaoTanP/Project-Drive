name: M5B Road Background Patch

on:
  push:
    branches:
      - feat/m5b-batch-a-assets
    paths:
      - '.github/workflows/m5b-road-background-patch.yml'

permissions:
  contents: write

jobs:
  patch-road:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/m5b-batch-a-assets
      - name: Patch city backdrop handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('WebGame/src/game/Road.ts')
          text = path.read_text()
          old = "    drawBackground(graphics, playerZone, width, height, view.playerPosition);\n"
          new = "    if (playerZone !== 'city') {\n      drawBackground(graphics, playerZone, width, height, view.playerPosition);\n    }\n"
          if old not in text:
              raise SystemExit('expected Road.render background call not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'DaoTanP'
          git config user.email '90591448+DaoTanP@users.noreply.github.com'
          git add WebGame/src/game/Road.ts
          git commit -m 'feat: hand city backdrop rendering to authored layers'
          git push origin HEAD:feat/m5b-batch-a-assets
