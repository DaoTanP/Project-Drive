name: M5C Batch B0 Docs Update

on:
  push:
    branches:
      - feat/m5c-batch-b0-integration
    paths:
      - '.github/workflows/m5c-docs-update.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m5c-batch-b0-integration

      - name: Record validated Batch B0 status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one marker, found {text.count(old)}')
              p.write_text(text.replace(old, new))

          replace_once(
              'Docs/05-Planning/M5-Presentation-and-Production-Assets.md',
              "**M5C.1 infrastructure status:** implemented and browser-validated. `Road.ts` now exposes deterministic sprite-backed roadside projections from the same M4 placement rules, while `GameScene.ts` owns a bounded reusable `Phaser.Image` pool. A temporary CI-only five-texture harness validated a fixed pool of 180 images, all five representative prop kinds, 514 far-to-near ordering samples, deterministic repeated projection, stable pool object reuse and real crest cropping. These synthetic textures were never committed and do **not** count toward M5.9 production-asset acceptance. Until real Batch B prop PNGs are committed/preloaded, the runtime intentionally retains M4 procedural roadside presentation.",
              "**M5C.1 infrastructure status:** implemented and browser-validated. `Road.ts` exposes deterministic sprite-backed roadside projections from the same M4 placement rules, while `GameScene.ts` owns a bounded reusable `Phaser.Image` pool. The original synthetic CI harness validated a fixed pool of 180 images, all five representative prop kinds, 514 far-to-near ordering samples, deterministic repeated projection, stable pool object reuse and real crest cropping.\n\n**Batch B0 production-candidate status (2026-09-13):** five candidate prop files were added, but validation does not accept them as one complete production set. `prop_streetlight.png` and `prop_chevron.png` are structurally valid RGBA PNGs with ground-contact alpha reaching their bottom edge, so they are preloaded and use the M5C.1 sprite path. `prop_guardrail.png` has a corrupt PNG `IDAT` checksum, while `prop_tree_cluster_01.png` and `prop_rock_cluster_01.png` are not PNG byte streams despite their extensions; those three are deliberately **not** preloaded and continue to use M4 procedural fallback. Streetlight/chevron also contain hundreds of colors outside `Night Courier 20` plus partially transparent edge pixels, so this is prototype integration rather than final palette/pixel-art approval. M5.9 stays open until the broken candidates are replaced and the shared production prop inventory/composition is completed."
          )

          replace_once(
              'Docs/05-Planning/Task-Backlog.md',
              "- [ ] M5.9 Produce/import Asset Batch B: approximately 15–18 reusable roadside/environment props shared across all five zones, prioritizing streetlight, guardrail, utility pole, tree cluster, rock/cliff cluster, chevron, tunnel portal/light and core signage. M5C.1 projection/pool/crest-clipping infrastructure is complete; production prop art/preload and visual composition remain open.",
              "- [ ] M5.9 Produce/import Asset Batch B: approximately 15–18 reusable roadside/environment props shared across all five zones, prioritizing streetlight, guardrail, utility pole, tree cluster, rock/cliff cluster, chevron, tunnel portal/light and core signage. M5C.1 projection/pool/crest-clipping infrastructure is complete. Batch B0 currently integrates 2/5 submitted candidates (`streetlight`, `chevron`); `guardrail` has corrupt PNG data and `tree`/`rock` are not PNG byte streams, so those kinds remain procedural fallback. The two integrated candidates still require final palette/pixel-edge approval, and the broader 15–18 prop composition remains open."
          )

          player_marker = "Post-fix analysis confirms every player frame now has visual alpha base `Y=232`, preserving a 23 px transparent margin below the vehicle. A 960x540 production-browser smoke confirmed the existing `(128,232)` Phaser origin places Center and Hard Left on the road without the previous vertical floating. A dedicated horizontal-bound audit confirms that all four non-center player frames (`Hard Left`, `Left`, `Right`, `Hard Right`) contain contiguous opaque runs on both `X=0` and `X=255`. These are source-clipping defects, not harmless edge proximity, and cannot be repaired losslessly by horizontal translation because the silhouettes already occupy the full 256 px width. They remain explicit re-export blockers; no runtime offset or per-state scaling is used to hide them."
          player_replacement = player_marker + "\n\n**2026-09-13 player-asset replacement regression:** a later user-supplied five-frame player update preserved the `256 x 256` canvas but moved visible alpha bases back to `Y=192/193/195/193/192` (`Hard Left/Left/Center/Right/Hard Right`). The integration branch re-registered those new sources with integer-only vertical translation `+40/+39/+37/+39/+40 px` respectively. Validation compared the complete multiset of visible RGBA pixels before/after each shift, proving no resize, resampling, recolor or visible-pixel loss; all five again end at visual alpha base `Y=232`. The replacement frames still touch both horizontal source edges and use a 13-color ramp outside `Night Courier 20`; those prototype-art issues remain deferred to M7.10 rather than hidden with runtime compensation."
          replace_once('Docs/06-Quality/M5-Presentation-Acceptance.md', player_marker, player_replacement)

          roadside_old = "M5C.1 was validated with five temporary CI-only synthetic textures (`streetlight`, `guardrail`, `tree`, `rock`, `chevron`). The production build/typecheck passed; the browser route scan used a fixed 180-image pool, encountered all five representative kinds, recorded 514 far-to-near multi-sprite samples, reproduced identical projected descriptors on repeated state, retained the same image objects, and encountered actual cropped sprites behind road crests. The synthetic files and test-only preload were not committed. This validates infrastructure only; `WebGame/public/assets/props/` still has no production Batch B art, so M5.9 remains open and the normal runtime keeps M4 procedural fallback presentation."
          roadside_new = "M5C.1 was validated with five temporary CI-only synthetic textures (`streetlight`, `guardrail`, `tree`, `rock`, `chevron`). The production build/typecheck passed; the browser route scan used a fixed 180-image pool, encountered all five representative kinds, recorded 514 far-to-near multi-sprite samples, reproduced identical projected descriptors on repeated state, retained the same image objects, and encountered actual cropped sprites behind road crests. The synthetic files and test-only preload were not committed.\n\n**Batch B0 candidate validation (2026-09-13):** `prop_streetlight.png` (`48 x 256`) and `prop_chevron.png` (`96 x 144`) are valid RGBA PNGs whose visible alpha reaches the bottom edge required by the existing bottom-origin projection. They are the only submitted Batch B0 candidates enabled in `BootScene`. `prop_guardrail.png` presents a PNG header but fails strict decoding with a bad `IDAT` checksum; `prop_tree_cluster_01.png` and `prop_rock_cluster_01.png` do not contain PNG signatures and cannot be decoded as images. Those three are excluded from preload and their M4 procedural kinds remain active. Streetlight and chevron also exceed the intended small Night Courier palette and contain partially transparent pixels, so their runtime integration is structurally accepted for prototype use but final pixel-art/palette/pivot readability approval remains open. M5.9 is therefore not complete."
          replace_once('Docs/06-Quality/M5-Presentation-Acceptance.md', roadside_old, roadside_new)
          PY

      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/05-Planning/M5-Presentation-and-Production-Assets.md Docs/05-Planning/Task-Backlog.md Docs/06-Quality/M5-Presentation-Acceptance.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: record Batch B0 asset validation'
          git push origin HEAD:feat/m5c-batch-b0-integration
