name: M4 Route Smoke

on:
  push:
    branches:
      - feat/m4-final-route-environments
    paths:
      - 'WebGame/**'
      - '.github/workflows/m4-route-smoke.yml'

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Install and build
        working-directory: WebGame
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm install --no-save --package-lock=false tsx@4.20.5 puppeteer-core@24.16.0
      - name: Verify M4 route rules
        working-directory: WebGame
        run: |
          cat > .m4-route-smoke.ts <<'TS'
          import assert from 'node:assert/strict';
          import { advanceGameState, createGameState } from './src/game/GameState';
          import { Player } from './src/game/Player';
          import { Road } from './src/game/Road';
          import { Scoring } from './src/game/Scoring';

          const road = new Road();
          assert.equal(road.zoneAtRouteDistance(0), 'city');
          assert.equal(road.zoneAtRouteDistance(200000), 'rural');
          assert.equal(road.branchDecisionDistance, 318800);
          assert.equal(road.destinationDistance, 838800);
          assert.equal(road.zoneAtRouteDistance(road.branchDecisionDistance + 1000), 'forest');
          assert.equal(road.zoneAtRouteDistance(560000), 'rural');

          road.selectBranch('risky');
          assert.equal(road.destinationDistance, 778800);
          assert.equal(road.zoneAtRouteDistance(road.branchDecisionDistance + 1000), 'mountain-pass');
          assert.equal(road.zoneAtRouteDistance(490000), 'tunnel');
          assert.equal(road.zoneAtRouteDistance(620000), 'city');

          function cleanRun(branch: 'risky' | 'safe') {
            const route = new Road();
            route.selectBranch(branch);
            const player = new Player();
            const state = createGameState({ timeLimitSeconds: 300, destinationDistance: route.destinationDistance });
            const dt = 1 / 60;
            while (!state.finished) {
              const position = route.positionForRouteDistance(state.routeDistance);
              player.update({ steer: 0, throttle: 1, brake: 0 }, dt, route.curveAt(position));
              advanceGameState(state, dt, player.speed * dt);
            }
            assert.equal(state.outcome, 'completed');
            return state.elapsedSeconds;
          }

          const riskySeconds = cleanRun('risky');
          const safeSeconds = cleanRun('safe');
          assert.ok(riskySeconds >= 240 && riskySeconds <= 300, `risky duration ${riskySeconds}`);
          assert.ok(safeSeconds >= 240 && safeSeconds <= 300, `safe duration ${safeSeconds}`);
          assert.ok(safeSeconds > riskySeconds + 10, `${safeSeconds} should exceed ${riskySeconds}`);

          const scoring = new Scoring();
          scoring.applyStep(4, 0);
          const completed = scoring.finalize('completed', 30, 90);
          assert.ok(completed.timeBonus > 0);
          assert.ok(completed.cargoBonus > 0);
          assert.equal(completed.score, completed.drivingScore + completed.timeBonus + completed.cargoBonus);
          const timeout = scoring.finalize('timeout', 0, 90);
          assert.equal(timeout.timeBonus, 0);
          assert.equal(timeout.cargoBonus, 0);
          assert.equal(timeout.rank, 'D');

          console.log(JSON.stringify({ riskySeconds, safeSeconds, riskyDistance: 778800, safeDistance: 838800 }));
          TS
          ./node_modules/.bin/tsx .m4-route-smoke.ts
          rm .m4-route-smoke.ts
      - name: Render representative environment zones
        working-directory: WebGame
        run: |
          cat > .m4-zone-smoke.html <<'HTML'
          <!doctype html><html><body style="margin:0;background:#080c18"><script type="module" src="/.m4-zone-smoke.ts"></script></body></html>
          HTML
          cat > .m4-zone-smoke.ts <<'TS'
          import Phaser from 'phaser';
          import { Road } from './src/game/Road';
          const params = new URLSearchParams(location.search);
          const branch = params.get('branch') === 'risky' ? 'risky' : 'safe';
          const distance = Number(params.get('distance') ?? 0);
          class ZoneScene extends Phaser.Scene {
            create() {
              const road = new Road();
              road.selectBranch(branch);
              road.render(this.add.graphics(), {
                playerPosition: road.positionForRouteDistance(distance),
                playerRoadX: 0,
                viewportWidth: 960,
                viewportHeight: 540,
              });
              this.add.text(16, 16, `${road.zoneAtRouteDistance(distance)} | ${branch} | ${distance}`, {
                fontFamily: 'monospace', fontSize: '18px', color: '#f5f3ea', backgroundColor: '#080c18cc',
              });
            }
          }
          new Phaser.Game({ type: Phaser.AUTO, width: 960, height: 540, scene: ZoneScene, banner: false });
          TS
          ./node_modules/.bin/vite --host 127.0.0.1 --port 4173 >/tmp/m4-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/.m4-zone-smoke.html >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const browser = await puppeteer.launch({ executablePath: '/usr/bin/google-chrome', headless: true, args: ['--no-sandbox', '--disable-gpu'] });
          const samples = [
            ['city', 'safe', 40000],
            ['rural', 'safe', 220000],
            ['forest', 'safe', 360000],
            ['mountain-pass', 'risky', 360000],
            ['tunnel', 'risky', 500000],
          ];
          for (const [name, branch, distance] of samples) {
            const page = await browser.newPage();
            await page.setViewport({ width: 960, height: 540, deviceScaleFactor: 1 });
            await page.goto(`http://127.0.0.1:4173/.m4-zone-smoke.html?branch=${branch}&distance=${distance}`, { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('canvas');
            await new Promise((resolve) => setTimeout(resolve, 500));
            const path = `/tmp/m4-${name}.png`;
            await page.screenshot({ path });
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) throw new Error(`missing ${path}`);
            await page.close();
          }
          await browser.close();
          NODE
          rm .m4-zone-smoke.html .m4-zone-smoke.ts
      - name: Upload zone screenshots
        uses: actions/upload-artifact@v4
        with:
          name: night-courier-m4-zones
          path: /tmp/m4-*.png
          if-no-files-found: error
