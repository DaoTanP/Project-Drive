name: M5C Clean Batch B0 Handoff

on:
  push:
    branches:
      - feat/m5c-batch-b0-runtime
    paths:
      - '.github/workflows/m5c-clean-handoff.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m5c-batch-b0-runtime
          fetch-depth: 0
      - name: Copy validated runtime and docs from staging branch
        run: |
          git fetch origin feat/m5c-prop-validation-rescale
          git checkout origin/feat/m5c-prop-validation-rescale -- \
            WebGame/src/scenes/BootScene.ts \
            WebGame/src/scenes/GameScene.ts \
            Docs/05-Planning/Task-Backlog.md \
            Docs/05-Planning/M5-Presentation-and-Production-Assets.md \
            Docs/06-Quality/M5-Presentation-Acceptance.md
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: WebGame/package-lock.json
      - name: Typecheck and build
        working-directory: WebGame
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit clean handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WebGame/src/scenes/BootScene.ts WebGame/src/scenes/GameScene.ts \
            Docs/05-Planning/Task-Backlog.md \
            Docs/05-Planning/M5-Presentation-and-Production-Assets.md \
            Docs/06-Quality/M5-Presentation-Acceptance.md
          git commit -m 'feat: integrate validated Batch B0 roadside props'
          git push origin HEAD:feat/m5c-batch-b0-runtime
