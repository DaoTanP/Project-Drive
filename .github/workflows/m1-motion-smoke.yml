name: M1 Motion Smoke

on:
  push:
    branches:
      - feat/m1-road-player
    paths:
      - 'WebGame/**'
      - '.github/workflows/m1-motion-smoke.yml'

permissions:
  contents: read

jobs:
  motion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Build and install temporary browser driver
        working-directory: WebGame
        run: |
          npm ci
          npm run build
          npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Exercise throttle, steering, curve and hill states
        run: |
          python3 -m http.server 4173 --directory WebGame/dist >/tmp/night-courier-m1-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          cd WebGame
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-gpu'],
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 960, height: 540, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('canvas', { timeout: 10000 });
          await new Promise((resolve) => setTimeout(resolve, 500));
          await page.screenshot({ path: '/tmp/m1-00-start.png' });

          await page.keyboard.down('ArrowUp');
          await new Promise((resolve) => setTimeout(resolve, 3500));
          await page.keyboard.down('ArrowRight');
          await new Promise((resolve) => setTimeout(resolve, 700));
          await page.keyboard.up('ArrowRight');
          await page.screenshot({ path: '/tmp/m1-01-steer.png' });

          await page.keyboard.down('ArrowLeft');
          await new Promise((resolve) => setTimeout(resolve, 700));
          await page.keyboard.up('ArrowLeft');
          await new Promise((resolve) => setTimeout(resolve, 2100));
          await page.screenshot({ path: '/tmp/m1-02-curve.png' });

          await new Promise((resolve) => setTimeout(resolve, 7000));
          await page.screenshot({ path: '/tmp/m1-03-hill.png' });
          await page.keyboard.up('ArrowUp');

          await browser.close();

          for (const path of [
            '/tmp/m1-00-start.png',
            '/tmp/m1-01-steer.png',
            '/tmp/m1-02-curve.png',
            '/tmp/m1-03-hill.png',
          ]) {
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) {
              throw new Error(`Missing screenshot: ${path}`);
            }
          }
          NODE

      - name: Upload motion screenshots
        uses: actions/upload-artifact@v4
        with:
          name: night-courier-m1-motion
          path: /tmp/m1-*.png
          if-no-files-found: error
