name: M1 Visual Smoke

on:
  push:
    branches:
      - feat/m1-road-player
    paths:
      - 'WebGame/**'
      - '.github/workflows/m1-visual-smoke.yml'

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Build WebGame
        working-directory: WebGame
        run: |
          npm ci
          npm run build

      - name: Capture 960x540 production canvas
        run: |
          python3 -m http.server 4173 --directory WebGame/dist >/tmp/night-courier-m1-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --window-size=960,540 \
            --virtual-time-budget=1500 \
            --screenshot=/tmp/night-courier-m1.png \
            http://127.0.0.1:4173/
          test -s /tmp/night-courier-m1.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: night-courier-m1-visual
          path: /tmp/night-courier-m1.png
          if-no-files-found: error
