name: M5C Player Registration Repair

on:
  push:
    branches:
      - feat/m5c-batch-b0-integration
    paths:
      - '.github/workflows/m5c-player-reregister.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m5c-batch-b0-integration
      - name: Re-register player sources to Y232
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('WebGame/public/assets/player')
          names = [
              'player_rear_hard_left.png','player_rear_left.png','player_rear_center.png',
              'player_rear_right.png','player_rear_hard_right.png',
          ]
          target_bottom = 232

          for name in names:
              path = root / name
              im = Image.open(path).convert('RGBA')
              if im.size != (256, 256):
                  raise SystemExit(f'{name}: expected 256x256, got {im.size}')
              alpha = im.getchannel('A')
              bbox = alpha.getbbox()
              if bbox is None:
                  raise SystemExit(f'{name}: empty image')
              source_bottom = bbox[3] - 1
              dy = target_bottom - source_bottom
              before_pixels = list(im.getdata())
              before_visible = sorted(px for px in before_pixels if px[3] > 0)
              shifted = Image.new('RGBA', im.size, (0,0,0,0))
              shifted.alpha_composite(im, (0, dy))
              after_bbox = shifted.getchannel('A').getbbox()
              if after_bbox is None or after_bbox[3] - 1 != target_bottom:
                  raise SystemExit(f'{name}: target base failed after shift {dy}')
              after_visible = sorted(px for px in shifted.getdata() if px[3] > 0)
              if before_visible != after_visible:
                  raise SystemExit(f'{name}: visible RGBA pixels changed/lost during shift {dy}')
              shifted.save(path, optimize=False)
              print(f'{name}: base {source_bottom} -> {target_bottom}, dy={dy}, bbox={after_bbox}')
          PY

      - name: Commit repaired registration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WebGame/public/assets/player/*.png
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore player sprite contact registration'
          git push origin HEAD:feat/m5c-batch-b0-integration
