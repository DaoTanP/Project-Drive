name: M5C Asset Audit

on:
  push:
    branches:
      - feat/m5c-batch-b0-integration
    paths:
      - '.github/workflows/m5c-asset-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit PNG contracts
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          palette = {
              (0x08,0x0C,0x18),(0x0E,0x16,0x28),(0x16,0x22,0x3A),(0x22,0x33,0x4D),(0x34,0x4A,0x64),
              (0x64,0x74,0x8A),(0x9B,0xAA,0xBC),(0xD5,0xDC,0xE5),(0xF5,0xF3,0xEA),(0xF4,0xC9,0x5D),
              (0xFF,0x91,0x4D),(0xEB,0x55,0x48),(0xFF,0x3B,0x8D),(0xB5,0x6C,0xFF),(0x22,0xD3,0xEE),
              (0x29,0xA9,0xE8),(0x55,0xE0,0x6F),(0xD6,0xF0,0x4B),(0xFF,0xCC,0x33),(0xFF,0x45,0x5D),
          }

          players = [
              'player_rear_hard_left.png','player_rear_left.png','player_rear_center.png',
              'player_rear_right.png','player_rear_hard_right.png',
          ]
          props = [
              'prop_streetlight.png','prop_guardrail.png','prop_tree_cluster_01.png',
              'prop_rock_cluster_01.png','prop_chevron.png',
          ]

          hard_failures = []
          warnings = []

          def verify_png(path: Path):
              try:
                  with Image.open(path) as check:
                      check.verify()
                  return None
              except Exception as exc:
                  return f'{type(exc).__name__}: {exc}'

          def audit(path: Path, *, player: bool):
              verify_error = verify_png(path)
              if verify_error:
                  hard_failures.append(f'{path.name}: PNG verify failed: {verify_error}')

              try:
                  im = Image.open(path).convert('RGBA')
              except Exception as exc:
                  hard_failures.append(f'{path.name}: cannot decode: {type(exc).__name__}: {exc}')
                  return

              w, h = im.size
              pixels = list(im.getdata())
              alpha = im.getchannel('A')
              bbox = alpha.getbbox()
              if bbox is None:
                  hard_failures.append(f'{path.name}: empty alpha')
                  return

              left, top, right, bottom = bbox
              margins = (left, top, w-right, h-bottom)
              edge = {
                  'L': any(alpha.getpixel((0,y)) > 0 for y in range(h)),
                  'R': any(alpha.getpixel((w-1,y)) > 0 for y in range(h)),
                  'T': any(alpha.getpixel((x,0)) > 0 for x in range(w)),
                  'B': any(alpha.getpixel((x,h-1)) > 0 for x in range(w)),
              }
              opaque_rgb = {px[:3] for px in pixels if px[3] > 0}
              off = sorted(opaque_rgb - palette)
              partial_alpha = sum(1 for px in pixels if 0 < px[3] < 255)
              transparent = sum(1 for px in pixels if px[3] == 0)

              print(
                  f'{path.name}: size={w}x{h} bbox={bbox} margins={margins} '
                  f'edge={edge} colors={len(opaque_rgb)} off_palette={len(off)} '
                  f'partial_alpha={partial_alpha} transparent={transparent} verify={verify_error or "ok"}'
              )
              if off:
                  print(f'  off-palette sample={off[:12]}')

              if player:
                  if (w, h) != (256, 256):
                      hard_failures.append(f'{path.name}: player source must be 256x256')
                  if bottom - 1 != 232:
                      hard_failures.append(f'{path.name}: visual alpha base Y must remain 232, got {bottom - 1}')
                  if edge['L'] or edge['R']:
                      warnings.append(f'{path.name}: horizontal edge contact remains (prototype-deferred to M7.10)')
                  if off:
                      warnings.append(f'{path.name}: {len(off)} visible RGB colors are outside Night Courier 20')
              else:
                  if w > 256 or h > 256 or w < 16 or h < 16:
                      warnings.append(f'{path.name}: dimensions {w}x{h} are outside current typical prop guidance')
                  if margins[3] > 4:
                      hard_failures.append(f'{path.name}: bottom transparent padding {margins[3]}px is too large for bottom-origin projection')
                  if transparent == 0:
                      hard_failures.append(f'{path.name}: no transparency detected')
                  if off:
                      warnings.append(f'{path.name}: {len(off)} visible RGB colors are outside Night Courier 20')
                  if partial_alpha:
                      warnings.append(f'{path.name}: {partial_alpha} partially transparent pixels may read anti-aliased under nearest-neighbor scaling')

          for name in players:
              audit(Path('WebGame/public/assets/player') / name, player=True)
          for name in props:
              audit(Path('WebGame/public/assets/props') / name, player=False)

          print('\nWARNINGS:')
          for warning in warnings:
              print(f'- {warning}')
          if hard_failures:
              print('\nHARD FAILURES:')
              for failure in hard_failures:
                  print(f'- {failure}')
              raise SystemExit(1)
          print('\nAsset audit hard gates passed.')
          PY
