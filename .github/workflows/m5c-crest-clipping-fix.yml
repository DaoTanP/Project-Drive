name: M5C Crest Clipping Fix

on:
  push:
    branches:
      - feat/m5c-roadside-sprites
    paths:
      - '.github/workflows/m5c-crest-clipping-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/m5c-roadside-sprites

      - name: Patch projected segment collection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('WebGame/src/game/Road.ts')
          text = path.read_text()

          old = "  private readonly visibleSegments: RoadSegment[] = [];\n"
          new = old + "  private readonly projectedSegments: RoadSegment[] = [];\n"
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = "    const visible = this.visibleSegments;\n    visible.length = 0;\n\n    this.projectionFrame += 1;"
          new = "    const visible = this.visibleSegments;\n    const projected = this.projectedSegments;\n    visible.length = 0;\n    projected.length = 0;\n\n    this.projectionFrame += 1;"
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = "      if (segment.p1.screen.cameraZ <= NEAR_CLIP || segment.p2.screen.cameraZ <= NEAR_CLIP) continue;\n      if (segment.p2.screen.y >= segment.p1.screen.y || segment.p2.screen.y >= maxVisibleY) continue;"
          new = "      if (segment.p1.screen.cameraZ <= NEAR_CLIP || segment.p2.screen.cameraZ <= NEAR_CLIP) continue;\n      projected.push(segment);\n      if (segment.p2.screen.y >= segment.p1.screen.y || segment.p2.screen.y >= maxVisibleY) continue;"
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = "    for (let i = this.visibleSegments.length - 1; i >= 0 && count < output.length; i -= 1) {\n      const segment = this.visibleSegments[i];"
          new = "    for (let i = this.projectedSegments.length - 1; i >= 0 && count < output.length; i -= 1) {\n      const segment = this.projectedSegments[i];"
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Typecheck and build
        working-directory: WebGame
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit crest clipping fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WebGame/src/game/Road.ts
          git commit -m "fix: retain projected segments for roadside crest clipping"
          git push origin HEAD:feat/m5c-roadside-sprites
