name: M5C Prop Docs Patch

on:
  push:
    branches:
      - feat/m5c-prop-validation-rescale
    paths:
      - '.github/workflows/m5c-prop-docs-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m5c-prop-validation-rescale
      - name: Synchronize M5 Batch B0 evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backlog = Path('Docs/05-Planning/Task-Backlog.md')
          text = backlog.read_text()
          old = """- [ ] M5.9 Produce/import Asset Batch B: approximately 15–18 reusable roadside/environment props shared across all five zones, prioritizing streetlight, guardrail, utility pole, tree cluster, rock/cliff cluster, chevron, tunnel portal/light and core signage. M5C.1 projection/pool/crest-clipping infrastructure is complete. Batch B0 currently integrates 2/5 submitted candidates (`streetlight`, `chevron`); `guardrail` has corrupt PNG data and `tree`/`rock` are not PNG byte streams, so those kinds remain procedural fallback. The two integrated candidates still require final palette/pixel-edge approval, and the broader 15–18 prop composition remains open."""
          new = """- [ ] M5.9 Produce/import Asset Batch B: approximately 15–18 reusable roadside/environment props shared across all five zones, prioritizing streetlight, guardrail, utility pole, tree cluster, rock/cliff cluster, chevron, tunnel portal/light and core signage. M5C.1 projection/pool/crest-clipping infrastructure is complete. Batch B0 now integrates all 5 representative production props (`streetlight`, `guardrail`, `tree`, `rock`, `chevron`) with validated alpha-base ground-contact pivots, pooled far-to-near projection and crest clipping. Final palette/pixel-edge cleanup plus the broader 15–18 prop inventory/composition remain open."""
          if old not in text:
              raise SystemExit('Task backlog M5.9 marker not found')
          backlog.write_text(text.replace(old, new, 1))

          plan = Path('Docs/05-Planning/M5-Presentation-and-Production-Assets.md')
          text = plan.read_text()
          old = """**Batch B0 production-candidate status (2026-09-13):** five candidate prop files were added, but validation does not accept them as one complete production set. `prop_streetlight.png` and `prop_chevron.png` are structurally valid RGBA PNGs with ground-contact alpha reaching their bottom edge, so they are preloaded and use the M5C.1 sprite path. `prop_guardrail.png` has a corrupt PNG `IDAT` checksum, while `prop_tree_cluster_01.png` and `prop_rock_cluster_01.png` are not PNG byte streams despite their extensions; those three are deliberately **not** preloaded and continue to use M4 procedural fallback. Streetlight/chevron also contain hundreds of colors outside `Night Courier 20` plus partially transparent edge pixels, so this is prototype integration rather than final palette/pixel-art approval. M5.9 stays open until the broken candidates are replaced and the shared production prop inventory/composition is completed."""
          new = """**Batch B0 runtime status (2026-09-13):** all five representative production props are valid, scaled runtime PNGs and are preloaded through `BootScene`: `streetlight`, `guardrail`, `tree`, `rock` and `chevron`. `GameScene` retains each complete uncropped source canvas but uses the validated visible alpha-base as the per-texture `originY`, so ground contact aligns to the projected road even when transparent bottom padding differs between assets. The real-asset browser route scan found all five kinds with no missing textures or origin mismatches, zero ground-contact position mismatches, 348 multi-sprite far-to-near ordering samples with zero ordering failures, 86 real crest-cropped samples, and stable reuse of the fixed 180-image pool. This completes the Batch B0 structural integration slice. M5.9 remains open for the remaining shared prop inventory/composition and final M7.10 palette/pixel-edge/human-readability approval."""
          if old not in text:
              raise SystemExit('M5 plan Batch B0 marker not found')
          plan.write_text(text.replace(old, new, 1))

          acceptance = Path('Docs/06-Quality/M5-Presentation-Acceptance.md')
          text = acceptance.read_text()
          old = """- [x] projected sprite objects are pooled/reused rather than allocated continuously per frame;\n- [ ] production prop pivots are visually approved after real Batch B PNGs exist;\n- [ ] all five zones remain distinguishable at gameplay speed with the shared production prop inventory."""
          new = """- [x] projected sprite objects are pooled/reused rather than allocated continuously per frame;\n- [x] all five Batch B0 representative prop textures use validated alpha-base ground-contact pivots without source cropping;\n- [ ] production prop pivots are human-approved at gameplay speed after the broader Batch B composition exists;\n- [ ] all five zones remain distinguishable at gameplay speed with the shared production prop inventory."""
          if old not in text:
              raise SystemExit('M5 acceptance pivot marker not found')
          text = text.replace(old, new, 1)
          old = """**Batch B0 candidate validation (2026-09-13):** all five updated files now pass strict PNG verification and decode as RGBA assets. Their submitted source canvases were much larger than the practical runtime-source bound, so each complete canvas was scaled proportionally with nearest-neighbor sampling until its longest edge was `256 px`; no alpha-bounds trimming, cropping or recoloring was performed. Resulting canvases are: `prop_streetlight.png` `85 x 256`, `prop_guardrail.png` `256 x 85`, `prop_tree_cluster_01.png` `160 x 256`, `prop_rock_cluster_01.png` `256 x 213`, and `prop_chevron.png` `171 x 256`. All five remain non-empty transparent PNGs after scaling. This validates source integrity/size only: `BootScene` still enables only streetlight and chevron, while guardrail/tree/rock remain on procedural fallback until the next runtime-integration pass. Palette consistency, partial-alpha cleanup and final ground-contact/pivot readability remain M7.10/final-art concerns. M5.9 is therefore still open."""
          new = """**Batch B0 production validation (2026-09-13):** all five updated files pass strict PNG verification and remain complete, uncropped transparent RGBA canvases after proportional nearest-neighbor scale-down: `prop_streetlight.png` `85 x 256`, `prop_guardrail.png` `256 x 85`, `prop_tree_cluster_01.png` `160 x 256`, `prop_rock_cluster_01.png` `256 x 213`, and `prop_chevron.png` `171 x 256`. All five are now preloaded and rendered through the M5C.1 sprite path. Because their transparent bottom padding differs, runtime presentation uses validated visual alpha bases as the texture-specific ground-contact origin (`244/256`, `76/85`, `253/256`, `209/213`, `252/256`) rather than cropping the PNGs. Production-browser validation on the risky route found all five prop kinds, zero missing textures, zero origin mismatches, zero projected ground-contact position mismatches, 348 far-to-near multi-sprite samples with zero ordering failures, 86 crest-cropped production-prop samples, and stable reuse of the fixed 180-image pool. Batch B0 structural integration is therefore accepted. Palette consistency, partial-alpha/pixel-edge cleanup and final human gameplay-speed pivot/readability approval remain M7.10 concerns; M5.9 remains open because the complete shared 15–18 prop vocabulary and final zone composition are not finished."""
          if old not in text:
              raise SystemExit('M5 acceptance Batch B0 marker not found')
          acceptance.write_text(text.replace(old, new, 1))
          PY
      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/05-Planning/Task-Backlog.md Docs/05-Planning/M5-Presentation-and-Production-Assets.md Docs/06-Quality/M5-Presentation-Acceptance.md
          git commit -m 'docs: record Batch B0 runtime validation'
          git push origin HEAD:feat/m5c-prop-validation-rescale
