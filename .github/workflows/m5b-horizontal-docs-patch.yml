name: M5B Horizontal Docs Patch

on:
  push:
    branches:
      - fix/m5b-horizontal-bounds
    paths:
      - '.github/workflows/m5b-horizontal-docs-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/m5b-horizontal-bounds

      - name: Record horizontal-bound evidence
        run: |
          python3 <<'PY'
          from pathlib import Path

          acceptance = Path('Docs/06-Quality/M5-Presentation-Acceptance.md')
          text = acceptance.read_text()

          old = "Several non-center player frames still touch the horizontal canvas boundary (`X=0/255`); that is a separate transparent-bound quality issue and is **not** being hidden through runtime offsets or per-state scaling."
          new = "A dedicated horizontal-bound audit confirms that all four non-center player frames (`Hard Left`, `Left`, `Right`, `Hard Right`) contain contiguous opaque runs on both `X=0` and `X=255`. These are source-clipping defects, not harmless edge proximity, and cannot be repaired losslessly by horizontal translation because the silhouettes already occupy the full 256 px width. They remain explicit re-export blockers; no runtime offset or per-state scaling is used to hide them."
          if old not in text:
              raise SystemExit('player horizontal paragraph not found')
          text = text.replace(old, new, 1)

          old = "The earlier browser smoke recorded the actual texture sequence `Center -> Left -> Hard Left` under binary keyboard input and the reverse sequence on release. Post-fix 960x540 browser rendering confirms the vertical grounding defect is resolved in representative city Center/Hard-Left views. M5.6/M5.8 remain open for horizontal transparent-bound cleanup/full visual approval and human all-zone gameplay-speed readability rather than vertical registration."
          new = "The earlier browser smoke recorded the actual texture sequence `Center -> Left -> Hard Left` under binary keyboard input and the reverse sequence on release. Post-fix 960x540 browser rendering confirms the vertical grounding defect is resolved. A later representative static render pass additionally captured city Center/Hard-Left/Hard-Right plus rural, forest, mountain-pass and tunnel Center views: player grounding/readability remained structurally clear in those captures. This is not a continuous human gameplay-speed approval, and the four clipped non-center source frames still block final M5.6/M5.8 acceptance."
          if old not in text:
              raise SystemExit('player gameplay paragraph not found')
          text = text.replace(old, new, 1)

          old = "Post-fix analysis confirms all twenty traffic frames end at visual alpha base `Y=232` with the original visible RGBA palette preserved. This resolves the vertical contact-line variance without adding per-texture runtime offsets. Human approval of apparent scale/yaw continuity and horizontal transparent bounds remains separate M5.8 work."
          new = "Post-fix analysis confirms all twenty traffic frames end at visual alpha base `Y=232` with the original visible RGBA palette preserved. A dedicated horizontal-bound audit then classified the remaining source edges. Taxi's four non-center frames and the other non-flagged traffic frames retain at least one transparent pixel at each horizontal edge and are tight but intact. `traffic_truck_rear_left.png` was the only losslessly correctable edge-touch case: it had a 4 px opaque run at `X=0` with 3 px spare on the opposite side, so the source was translated exactly `+1 px` on X, producing margins `1/2` without resize/resample or palette change. Three traffic frames remain true source-clipping blockers: `traffic_hatchback_rear_hard_left.png`, `traffic_hatchback_rear_right.png`, and `traffic_van_rear_hard_right.png`. Their contiguous opaque edge runs cannot be restored by translation and require source re-export/regeneration."
          if old not in text:
              raise SystemExit('traffic horizontal paragraph not found')
          text = text.replace(old, new, 1)

          old = "Pure regression validation re-ran collision one-shot, near-miss one-shot, cargo damage and speed retention after the traffic rendering change. Representative browser renders also confirmed production traffic textures are projected in city, forest, mountain-pass and tunnel test views."
          new = "Pure regression validation re-ran collision one-shot, near-miss one-shot, cargo damage and speed retention after the traffic rendering change. The horizontal-bound follow-up also captured representative 960x540 city, rural, forest, mountain-pass and tunnel views with visible traffic and a correctly grounded Center player. Those static structural renders pass, but continuous human gameplay-speed silhouette/yaw approval remains open, and the three clipped traffic sources above prevent final family acceptance."
          if old not in text:
              raise SystemExit('traffic runtime paragraph not found')
          text = text.replace(old, new, 1)

          acceptance.write_text(text)

          backlog = Path('Docs/05-Planning/Task-Backlog.md')
          b = backlog.read_text()
          old = "**M5B status:** runtime Batch A integration is implemented and structurally validated: all 27 standard Batch A images load with frozen source dimensions, four traffic visual identities map to the existing three behavior classes, five-yaw traffic presentation derives from projected road tangent, player binary steering traverses moderate/hard poses, city far/mid authored parallax is active, and M3 collision/near-miss regression remains clean. All 25 player/traffic PNGs are now re-registered in-source to the canonical visual base `Y=232` using integer pixel translation only; post-fix asset analysis and representative 960x540 browser rendering pass. M5.6/M5.8 remain open for horizontal transparent-bound cleanup, remaining family visual approval and human all-zone gameplay-speed readability."
          new = "**M5B status:** runtime Batch A integration is implemented and structurally validated: all 27 standard Batch A images load with frozen source dimensions, four traffic visual identities map to the existing three behavior classes, five-yaw traffic presentation derives from projected road tangent, player binary steering traverses moderate/hard poses, city far/mid authored parallax is active, and M3 collision/near-miss regression remains clean. All 25 player/traffic PNGs are re-registered in-source to visual base `Y=232`. Horizontal-bound audit found one safely correctable edge-touch (`traffic_truck_rear_left.png`, translated `+1 px` X) and seven true clipped source frames: player `Hard Left/Left/Right/Hard Right`, hatchback `Hard Left/Right`, and van `Hard Right`. Representative static 960x540 city/rural/forest/mountain-pass/tunnel renders remain structurally readable. M5.6/M5.8 stay open until those seven sources are re-exported without crop and final family/human gameplay-speed review passes."
          if old not in b:
              raise SystemExit('M5B status not found')
          b = b.replace(old, new, 1)

          old = "- [ ] M5.6 Produce/import Asset Batch A: five `256 x 256` player steering poses, complete `256 x 256` five-yaw families for at least three traffic identities (standard target: taxi, hatchback, van, truck = 20 traffic frames), plus city far/mid backgrounds. Runtime import and vertical source registration are complete; horizontal transparent-bound cleanup/full visual approval remains open."
          new = "- [ ] M5.6 Produce/import Asset Batch A: five `256 x 256` player steering poses, complete `256 x 256` five-yaw families for at least three traffic identities (standard target: taxi, hatchback, van, truck = 20 traffic frames), plus city far/mid backgrounds. Runtime import and vertical source registration are complete; seven source frames remain horizontally clipped and require re-export before full visual approval."
          if old not in b:
              raise SystemExit('M5.6 line not found')
          b = b.replace(old, new, 1)

          old = "- [ ] M5.8 Validate player and traffic readability against representative `city`, `forest`, `mountain-pass` and `tunnel` compositions at gameplay speed, including stable yaw-family registration and no collision/near-miss regression. Vertical registration, structural/browser checks and M3 regression pass; horizontal bounds/full family visual approval and human all-zone gameplay-speed readability remain open."
          new = "- [ ] M5.8 Validate player and traffic readability against representative `city`, `forest`, `mountain-pass` and `tunnel` compositions at gameplay speed, including stable yaw-family registration and no collision/near-miss regression. Vertical registration, static representative city/rural/forest/mountain-pass/tunnel browser checks and M3 regression pass; seven clipped sources plus continuous human gameplay-speed/family approval remain open."
          if old not in b:
              raise SystemExit('M5.8 line not found')
          b = b.replace(old, new, 1)
          backlog.write_text(b)
          PY

      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/05-Planning/Task-Backlog.md Docs/06-Quality/M5-Presentation-Acceptance.md
          git diff --cached --quiet && { echo 'expected docs changes missing'; exit 1; }
          git commit -m 'docs: record horizontal vehicle bound audit'
          git push origin HEAD:fix/m5b-horizontal-bounds
