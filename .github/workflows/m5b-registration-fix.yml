name: M5B Vehicle Registration Fix

on:
  push:
    branches:
      - fix/m5b-vehicle-registration
    paths:
      - '.github/workflows/m5b-registration-fix.yml'

permissions:
  contents: write

jobs:
  fix-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/m5b-vehicle-registration

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Re-register vehicle PNGs to Y=232
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          ROOT = Path('WebGame/public/assets')
          TARGET_Y = 232
          paths = sorted((ROOT/'player').glob('player_rear_*.png')) + sorted((ROOT/'traffic').glob('traffic_*_rear_*.png'))
          if len(paths) != 25:
              raise SystemExit(f'expected 25 vehicle PNGs, found {len(paths)}')

          report = []
          for path in paths:
              im = Image.open(path).convert('RGBA')
              if im.size != (256,256):
                  raise SystemExit(f'{path}: expected 256x256, got {im.size}')
              alpha = im.getchannel('A')
              bbox = alpha.getbbox()
              if not bbox:
                  raise SystemExit(f'{path}: empty alpha')
              left, top, right_ex, bottom_ex = bbox
              bottom = bottom_ex - 1
              dy = TARGET_Y - bottom

              # Translation only: no scaling/resampling. Refuse any operation that would crop
              # non-transparent source pixels.
              if top + dy < 0 or bottom + dy > 255:
                  raise SystemExit(f'{path}: dy={dy} would crop alpha bbox {bbox}')

              before_visible = sorted(set(px for px in im.getdata() if px[3] > 0))
              shifted = Image.new('RGBA', (256,256), (0,0,0,0))
              shifted.alpha_composite(im, (0,dy))
              after_bbox = shifted.getchannel('A').getbbox()
              if not after_bbox or after_bbox[3] - 1 != TARGET_Y:
                  raise SystemExit(f'{path}: after bottom is not {TARGET_Y}: {after_bbox}')
              after_visible = sorted(set(px for px in shifted.getdata() if px[3] > 0))
              if before_visible != after_visible:
                  raise SystemExit(f'{path}: visible RGBA palette changed during translation')

              shifted.save(path, optimize=False)
              report.append({
                  'file': str(path),
                  'before_bbox': [left, top, right_ex-1, bottom],
                  'dy': dy,
                  'after_bbox': [after_bbox[0], after_bbox[1], after_bbox[2]-1, after_bbox[3]-1],
              })

          Path('/tmp/vehicle-registration-fix.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Verify asset contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path('WebGame/public/assets/player').glob('player_rear_*.png')) + sorted(Path('WebGame/public/assets/traffic').glob('traffic_*_rear_*.png'))
          assert len(files) == 25
          for path in files:
              im = Image.open(path).convert('RGBA')
              assert im.size == (256,256), path
              bbox = im.getchannel('A').getbbox()
              assert bbox and bbox[3]-1 == 232, (path, bbox)
              assert any(px[3] == 0 for px in im.getdata()), path
              visible_rgb = {px[:3] for px in im.getdata() if px[3] > 0}
              assert len(visible_rgb) <= 24, (path, len(visible_rgb))
          print(f'verified {len(files)} vehicle PNGs at canonical visual base Y=232')
          PY

      - name: Commit corrected PNG registration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WebGame/public/assets/player WebGame/public/assets/traffic
          git diff --cached --quiet && { echo 'no PNG changes'; exit 1; }
          git commit -m 'fix: re-register vehicle sprites to canonical contact line'
          git push origin HEAD:fix/m5b-vehicle-registration

      - name: Upload translation report
        uses: actions/upload-artifact@v4
        with:
          name: m5b-registration-fix-report
          path: /tmp/vehicle-registration-fix.json
          if-no-files-found: error
