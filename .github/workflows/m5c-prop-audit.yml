name: M5C Prop Audit

on:
  push:
    branches:
      - feat/m5c-prop-validation-rescale
    paths:
      - '.github/workflows/m5c-prop-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit updated props
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('WebGame/public/assets/props')
          names = [
              'prop_streetlight.png',
              'prop_guardrail.png',
              'prop_tree_cluster_01.png',
              'prop_rock_cluster_01.png',
              'prop_chevron.png',
          ]
          palette = {
              (0x08,0x0C,0x18),(0x0E,0x16,0x28),(0x16,0x22,0x3A),(0x22,0x33,0x4D),(0x34,0x4A,0x64),
              (0x64,0x74,0x8A),(0x9B,0xAA,0xBC),(0xD5,0xDC,0xE5),(0xF5,0xF3,0xEA),(0xF4,0xC9,0x5D),
              (0xFF,0x91,0x4D),(0xEB,0x55,0x48),(0xFF,0x3B,0x8D),(0xB5,0x6C,0xFF),(0x22,0xD3,0xEE),
              (0x29,0xA9,0xE8),(0x55,0xE0,0x6F),(0xD6,0xF0,0x4B),(0xFF,0xCC,0x33),(0xFF,0x45,0x5D),
          }

          failures = []
          for name in names:
              path = root / name
              try:
                  with Image.open(path) as verify:
                      verify.verify()
                  im = Image.open(path).convert('RGBA')
              except Exception as exc:
                  failures.append(f'{name}: decode/verify failed: {type(exc).__name__}: {exc}')
                  continue

              w, h = im.size
              pixels = list(im.getdata())
              alpha = im.getchannel('A')
              bbox = alpha.getbbox()
              if bbox is None:
                  failures.append(f'{name}: empty alpha')
                  continue
              left, top, right, bottom = bbox
              margins = (left, top, w-right, h-bottom)
              edge = {
                  'L': any(alpha.getpixel((0,y)) > 0 for y in range(h)),
                  'R': any(alpha.getpixel((w-1,y)) > 0 for y in range(h)),
                  'T': any(alpha.getpixel((x,0)) > 0 for x in range(w)),
                  'B': any(alpha.getpixel((x,h-1)) > 0 for x in range(w)),
              }
              visible = {px[:3] for px in pixels if px[3] > 0}
              off = visible - palette
              partial = sum(1 for px in pixels if 0 < px[3] < 255)
              transparent = sum(1 for px in pixels if px[3] == 0)
              scale = min(1.0, 256 / max(w, h))
              target = (max(1, round(w * scale)), max(1, round(h * scale)))
              print(
                  f'{name}: size={w}x{h} bbox={bbox} margins={margins} edge={edge} '
                  f'colors={len(visible)} off_palette={len(off)} partial_alpha={partial} '
                  f'transparent={transparent} target_if_over_256={target}'
              )
              if bottom != h:
                  print(f'  NOTE bottom transparent padding={h-bottom}px')
              if w > 256 or h > 256:
                  print(f'  SCALE_REQUIRED preserve-aspect nearest-neighbor -> {target[0]}x{target[1]}')

          if failures:
              print('\nHARD FAILURES:')
              for failure in failures:
                  print(f'- {failure}')
              raise SystemExit(1)
          print('\nAll five files are valid decodable PNGs.')
          PY
