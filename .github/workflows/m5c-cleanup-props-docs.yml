name: M5C Cleanup Props Docs

on:
  push:
    branches:
      - fix/m5c-cleanup-new-props
    paths:
      - '.github/workflows/m5c-cleanup-props-docs.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/m5c-cleanup-new-props
      - name: Synchronize Batch B source-cleanup status
        run: |
          python3 <<'PY'
          from pathlib import Path

          backlog = Path('Docs/05-Planning/Task-Backlog.md')
          text = backlog.read_text()
          old = "**M5C.1 status:** roadside sprite projection/pooling infrastructure is implemented and validated with CI-only synthetic textures. Deterministic M4 placement, fixed image-pool reuse, far-to-near ordering and crest clipping pass. No production prop PNGs are committed yet, so M5.9 remains open and the normal build intentionally keeps the procedural M4 fallback."
          new = "**M5C.1 status:** roadside sprite projection/pooling infrastructure is implemented and validated. Batch B0 integrates five production roadside props through the pooled projected-sprite path; seven additional utility/signage/tunnel/destination prop PNGs are now source-normalized and awaiting runtime placement/pivot integration. M5.9 remains open for the full 15–18 shared-prop vocabulary, composition and final visual approval."
          if old not in text:
              raise SystemExit('M5C.1 status marker not found')
          text = text.replace(old, new, 1)
          old = "- [ ] M5.9 Produce/import Asset Batch B: approximately 15–18 reusable roadside/environment props shared across all five zones, prioritizing streetlight, guardrail, utility pole, tree cluster, rock/cliff cluster, chevron, tunnel portal/light and core signage. M5C.1 projection/pool/crest-clipping infrastructure is complete. Batch B0 now integrates all 5 representative production props (`streetlight`, `guardrail`, `tree`, `rock`, `chevron`) with validated alpha-base ground-contact pivots, pooled far-to-near projection and crest clipping. Final palette/pixel-edge cleanup plus the broader 15–18 prop inventory/composition remain open."
          new = "- [ ] M5.9 Produce/import Asset Batch B: approximately 15–18 reusable roadside/environment props shared across all five zones, prioritizing streetlight, guardrail, utility pole, tree cluster, rock/cliff cluster, chevron, tunnel portal/light and core signage. M5C.1 projection/pool/crest-clipping infrastructure is complete. Batch B0 integrates 5 representative production props (`streetlight`, `guardrail`, `tree`, `rock`, `chevron`). Seven additional source assets (`utility_pole`, `caution_sign`, `commercial_sign`, `destination_marker`, `expressway_gantry`, `tunnel_light`, `tunnel_portal`) have passed strict PNG decode and proportional nearest-neighbor normalization to a maximum 256 px edge, but are not yet runtime-integrated. Final palette/pixel-edge cleanup, per-prop pivot/placement validation and the broader 15–18 prop composition remain open."
          if old not in text:
              raise SystemExit('M5.9 marker not found')
          backlog.write_text(text.replace(old, new, 1))

          plan = Path('Docs/05-Planning/M5-Presentation-and-Production-Assets.md')
          text = plan.read_text()
          marker = "**Batch B0 runtime status (2026-09-13):** all five representative production props are valid, scaled runtime PNGs and are preloaded through `BootScene`: `streetlight`, `guardrail`, `tree`, `rock` and `chevron`. `GameScene` retains each complete uncropped source canvas but uses the validated visible alpha-base as the per-texture `originY`, so ground contact aligns to the projected road even when transparent bottom padding differs between assets. The real-asset browser route scan found all five kinds with no missing textures or origin mismatches, zero ground-contact position mismatches, 348 multi-sprite far-to-near ordering samples with zero ordering failures, 86 real crest-cropped samples, and stable reuse of the fixed 180-image pool. This completes the Batch B0 structural integration slice. M5.9 remains open for the remaining shared prop inventory/composition and final M7.10 palette/pixel-edge/human-readability approval."
          addition = marker + "\n\n**Batch B source-cleanup status (2026-09-14):** seven newly added/updated props pass strict PNG decode and are normalized as full uncropped RGBA canvases with proportional nearest-neighbor scale-down to a maximum `256 px` edge: `prop_caution_sign.png` `183 x 256`, `prop_commercial_sign.png` `256 x 192`, `prop_utility_pole.png` `85 x 256`, `prop_destination_marker.png` `256 x 205`, `prop_expressway_gantry.png` `256 x 160`, `prop_tunnel_light.png` `256 x 85`, and `prop_tunnel_portal.png` `256 x 192`. No recoloring or alpha-bound trimming was performed. These files are source-ready only; their runtime preload mapping, projection role, landmark/ambient placement and ground-contact/overhead pivots remain a separate integration pass."
          if marker not in text:
              raise SystemExit('Batch B0 plan marker not found')
          plan.write_text(text.replace(marker, addition, 1))

          acceptance = Path('Docs/06-Quality/M5-Presentation-Acceptance.md')
          text = acceptance.read_text()
          marker = "**Batch B0 production validation (2026-09-13):** all five updated files pass strict PNG verification and remain complete, uncropped transparent RGBA canvases after proportional nearest-neighbor scale-down: `prop_streetlight.png` `85 x 256`, `prop_guardrail.png` `256 x 85`, `prop_tree_cluster_01.png` `160 x 256`, `prop_rock_cluster_01.png` `256 x 213`, and `prop_chevron.png` `171 x 256`. All five are now preloaded and rendered through the M5C.1 sprite path. Because their transparent bottom padding differs, runtime presentation uses validated visual alpha bases as the texture-specific ground-contact origin (`244/256`, `76/85`, `253/256`, `209/213`, `252/256`) rather than cropping the PNGs. Production-browser validation on the risky route found all five prop kinds, zero missing textures, zero origin mismatches, zero projected ground-contact position mismatches, 348 far-to-near multi-sprite samples with zero ordering failures, 86 crest-cropped production-prop samples, and stable reuse of the fixed 180-image pool. Batch B0 structural integration is therefore accepted. Palette consistency, partial-alpha/pixel-edge cleanup and final human gameplay-speed pivot/readability approval remain M7.10 concerns; M5.9 remains open because the complete shared 15–18 prop vocabulary and final zone composition are not finished."
          addition = marker + "\n\n**Additional Batch B source validation (2026-09-14):** `prop_caution_sign`, `prop_commercial_sign`, `prop_utility_pole`, `prop_destination_marker`, `prop_expressway_gantry`, `prop_tunnel_light` and `prop_tunnel_portal` all pass strict decode as non-empty RGBA PNGs. Their original oversized canvases were proportionally reduced with nearest-neighbor sampling to `183 x 256`, `256 x 192`, `85 x 256`, `256 x 205`, `256 x 160`, `256 x 85` and `256 x 192` respectively. Full source canvases were retained; no cropping, alpha-bound trimming or recoloring was performed. This accepts source integrity/size only. Runtime preload, placement classification, pivot choice, crest/overhead behavior and gameplay-speed readability remain open."
          if marker not in text:
              raise SystemExit('Batch B0 acceptance marker not found')
          acceptance.write_text(text.replace(marker, addition, 1))
          PY
      - name: Commit documentation sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/05-Planning/Task-Backlog.md Docs/05-Planning/M5-Presentation-and-Production-Assets.md Docs/06-Quality/M5-Presentation-Acceptance.md
          git commit -m 'docs: record new Batch B prop cleanup'
          git push origin HEAD:fix/m5c-cleanup-new-props
