name: M5B Traffic Regression

on:
  push:
    branches:
      - feat/m5b-batch-a-assets
    paths:
      - 'WebGame/src/game/Traffic.ts'
      - '.github/workflows/m5b-traffic-regression.yml'

permissions:
  contents: read

jobs:
  traffic-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Install dependencies
        working-directory: WebGame
        run: |
          npm ci
          npm install --no-save --package-lock=false tsx@4.20.5
      - name: Verify M3 traffic behavior and Batch A registry
        working-directory: WebGame
        run: |
          npx tsx <<'TS'
          import assert from 'node:assert/strict';
          import { Traffic, TRAFFIC_TEXTURE_KEYS } from './src/game/Traffic.ts';

          assert.equal(TRAFFIC_TEXTURE_KEYS.length, 20);
          assert.equal(new Set(TRAFFIC_TEXTURE_KEYS).size, 20);

          const collisionTraffic = new Traffic();
          const collision = collisionTraffic.update(0, 0, 5000, -0.52);
          assert.equal(collision.collisions, 1);
          assert.equal(collision.nearMisses, 0);
          assert.equal(collision.cargoDamage, 7);
          assert.equal(collision.speedRetention, 0.68);

          const collisionAgain = collisionTraffic.update(0, 5000, 5000, -0.52);
          assert.equal(collisionAgain.collisions, 0);
          assert.equal(collisionAgain.cargoDamage, 0);

          const nearMissTraffic = new Traffic();
          const nearMiss = nearMissTraffic.update(0, 0, 5000, -0.12);
          assert.equal(nearMiss.collisions, 0);
          assert.equal(nearMiss.nearMisses, 1);
          assert.equal(nearMiss.cargoDamage, 0);
          assert.equal(nearMiss.speedRetention, 1);

          const nearMissAgain = nearMissTraffic.update(0, 5000, 5000, -0.12);
          assert.equal(nearMissAgain.nearMisses, 0);

          console.log('M3 traffic collision/near-miss regression passed with 20-texture Batch A registry.');
          TS
