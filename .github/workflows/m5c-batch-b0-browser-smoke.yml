name: M5C Batch B0 Browser Smoke

on:
  push:
    branches:
      - feat/m5c-batch-b0-integration
    paths:
      - '.github/workflows/m5c-batch-b0-browser-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebGame
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'

      - name: Verify integrated source assets
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          player_root = Path('public/assets/player')
          for name in [
              'player_rear_hard_left.png','player_rear_left.png','player_rear_center.png',
              'player_rear_right.png','player_rear_hard_right.png',
          ]:
              path = player_root / name
              with Image.open(path) as verify:
                  verify.verify()
              im = Image.open(path).convert('RGBA')
              assert im.size == (256, 256), (name, im.size)
              bbox = im.getchannel('A').getbbox()
              assert bbox is not None and bbox[3] - 1 == 232, (name, bbox)
              print(f'{name}: bbox={bbox}, baseY={bbox[3]-1}')

          for name in ['prop_streetlight.png', 'prop_chevron.png']:
              path = Path('public/assets/props') / name
              with Image.open(path) as verify:
                  verify.verify()
              im = Image.open(path).convert('RGBA')
              bbox = im.getchannel('A').getbbox()
              assert bbox is not None
              assert bbox[3] == im.height, (name, bbox, im.size)
              print(f'{name}: size={im.size}, bbox={bbox}')
          PY

      - name: Inject test-only game handle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main.ts')
          text = path.read_text()
          old = 'new Phaser.Game(gameConfig);'
          new = '(window as typeof window & { __m5cGame?: Phaser.Game }).__m5cGame = new Phaser.Game(gameConfig);'
          if text.count(old) != 1:
              raise SystemExit('main game marker mismatch')
          path.write_text(text.replace(old, new))
          PY

      - name: Build production package
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm install --no-save --package-lock=false puppeteer-core@24.16.0

      - name: Validate production roadside integration
        run: |
          mkdir -p /tmp/m5c-b0-shots
          python3 -m http.server 4173 --directory dist >/tmp/m5c-b0-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done

          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-gpu'],
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 960, height: 540, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('canvas');
          await new Promise((resolve) => setTimeout(resolve, 900));

          const result = await page.evaluate(() => {
            const game = window.__m5cGame;
            if (!game) throw new Error('missing test game handle');
            if (!game.scene.isActive('Game')) throw new Error('Boot did not transition to Game');
            const scene = game.scene.getScene('Game');
            game.scene.pause('Game');

            const kinds = [...scene.roadsideSpriteKinds].sort();
            const expected = ['chevron', 'light'];
            if (JSON.stringify(kinds) !== JSON.stringify(expected)) {
              throw new Error(`unexpected production roadside kinds: ${kinds.join(',')}`);
            }
            if (scene.roadsideSprites.length !== 180) {
              throw new Error(`expected fixed 180-image pool, got ${scene.roadsideSprites.length}`);
            }
            if (!scene.textures.exists('prop_streetlight') || !scene.textures.exists('prop_chevron')) {
              throw new Error('integrated production textures are missing from Phaser registry');
            }
            for (const invalid of ['prop_guardrail', 'prop_tree_cluster_01', 'prop_rock_cluster_01']) {
              if (scene.textures.exists(invalid)) {
                throw new Error(`invalid candidate should not be preloaded: ${invalid}`);
              }
            }

            const poolRefs = scene.roadsideSprites.slice();
            const foundKinds = new Set();
            let orderingSamples = 0;
            let representative = null;

            function renderAt(branch, distance) {
              scene.road.selectBranch(branch);
              scene.runState.routeDistance = distance;
              scene.renderFrame();
              const visible = [];
              for (let i = 0; i < scene.roadsideSprites.length; i += 1) {
                const image = scene.roadsideSprites[i];
                if (!image.visible) continue;
                const p = scene.roadsideSpriteProjections[i];
                foundKinds.add(p.kind);
                visible.push({
                  kind: p.kind,
                  texture: image.texture.key,
                  cameraZ: p.cameraZ,
                  depth: image.depth,
                });
              }
              for (let i = 1; i < visible.length; i += 1) {
                if (visible[i - 1].cameraZ < visible[i].cameraZ) {
                  throw new Error('production roadside projections are not far-to-near');
                }
                if (visible[i - 1].depth >= visible[i].depth) {
                  throw new Error('production roadside sprite depth is not increasing nearward');
                }
              }
              if (visible.length > 1) orderingSamples += 1;
              if (representative === null && visible.some((x) => x.kind === 'chevron')) {
                representative = { branch, distance };
              }
            }

            for (const branch of ['safe', 'risky']) {
              scene.road.selectBranch(branch);
              const end = scene.road.destinationDistance;
              for (let distance = 0; distance < end; distance += 3000) {
                renderAt(branch, distance);
              }
            }

            for (const required of expected) {
              if (!foundKinds.has(required)) throw new Error(`route scan never rendered ${required}`);
            }
            if (orderingSamples < 5) throw new Error(`insufficient ordering samples: ${orderingSamples}`);
            for (let i = 0; i < poolRefs.length; i += 1) {
              if (scene.roadsideSprites[i] !== poolRefs[i]) {
                throw new Error(`roadside pool object replaced at index ${i}`);
              }
            }

            return {
              kinds,
              foundKinds: [...foundKinds].sort(),
              poolSize: poolRefs.length,
              orderingSamples,
              representative,
            };
          });

          console.log(result);
          if (result.representative) {
            await page.evaluate(({ branch, distance }) => {
              const scene = window.__m5cGame.scene.getScene('Game');
              scene.road.selectBranch(branch);
              scene.runState.routeDistance = distance;
              scene.renderFrame();
            }, result.representative);
          }
          await page.screenshot({ path: '/tmp/m5c-b0-shots/batch-b0-production.png' });
          await browser.close();
          NODE

      - name: Upload representative render
        uses: actions/upload-artifact@v4
        with:
          name: m5c-batch-b0-production-render
          path: /tmp/m5c-b0-shots/*.png
          if-no-files-found: error
