name: M5C Prop Rescale

on:
  push:
    branches:
      - feat/m5c-prop-validation-rescale
    paths:
      - '.github/workflows/m5c-prop-rescale.yml'

permissions:
  contents: write

jobs:
  rescale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m5c-prop-validation-rescale
      - name: Scale down oversized prop canvases without cropping
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('WebGame/public/assets/props')
          names = [
              'prop_streetlight.png',
              'prop_guardrail.png',
              'prop_tree_cluster_01.png',
              'prop_rock_cluster_01.png',
              'prop_chevron.png',
          ]

          for name in names:
              path = root / name
              with Image.open(path) as src:
                  rgba = src.convert('RGBA')
              w, h = rgba.size
              before_bbox = rgba.getchannel('A').getbbox()
              if before_bbox is None:
                  raise SystemExit(f'{name}: empty alpha')

              scale = min(1.0, 256 / max(w, h))
              tw = max(1, round(w * scale))
              th = max(1, round(h * scale))
              if (tw, th) == (w, h):
                  print(f'{name}: unchanged {w}x{h}')
                  continue

              out = rgba.resize((tw, th), resample=Image.Resampling.NEAREST)
              after_bbox = out.getchannel('A').getbbox()
              if after_bbox is None:
                  raise SystemExit(f'{name}: alpha disappeared after resize')
              out.save(path, format='PNG', optimize=False)
              print(f'{name}: {w}x{h} -> {tw}x{th}; bbox {before_bbox} -> {after_bbox}; full canvas preserved, no crop')
          PY

      - name: Verify scaled files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              'prop_streetlight.png': (85, 256),
              'prop_guardrail.png': (256, 85),
              'prop_tree_cluster_01.png': (160, 256),
              'prop_rock_cluster_01.png': (256, 213),
              'prop_chevron.png': (171, 256),
          }
          for name, size in expected.items():
              path = Path('WebGame/public/assets/props') / name
              with Image.open(path) as check:
                  check.verify()
              im = Image.open(path).convert('RGBA')
              if im.size != size:
                  raise SystemExit(f'{name}: expected {size}, got {im.size}')
              bbox = im.getchannel('A').getbbox()
              if bbox is None:
                  raise SystemExit(f'{name}: empty alpha')
              if im.width > 256 or im.height > 256:
                  raise SystemExit(f'{name}: still exceeds 256px bound')
              print(f'{name}: size={im.size} bbox={bbox} margins={(bbox[0], bbox[1], im.width-bbox[2], im.height-bbox[3])}')
          print('All five scaled PNGs verify successfully.')
          PY

      - name: Commit scaled props
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WebGame/public/assets/props/prop_streetlight.png \
                  WebGame/public/assets/props/prop_guardrail.png \
                  WebGame/public/assets/props/prop_tree_cluster_01.png \
                  WebGame/public/assets/props/prop_rock_cluster_01.png \
                  WebGame/public/assets/props/prop_chevron.png
          if git diff --cached --quiet; then
            echo 'No scaling changes to commit.'
          else
            git commit -m 'fix: scale Batch B0 props to runtime source bounds'
            git push origin HEAD:feat/m5c-prop-validation-rescale
          fi
